		<!-- Lightbox -->
		<div id="lightbox"><a href="#" class="close" aria-label="Close">&times;</a><img src="" alt="" /></div>
		<script>
			(function() {
				var box = document.getElementById('lightbox'), img = box.querySelector('img');
				document.querySelectorAll('.box.alt.gallery a.image').forEach(function(a) {
					a.addEventListener('click', function(e) {
						e.preventDefault();
						img.src = a.getAttribute('href');
						box.classList.add('visible');
					});
				});
				function close(e) { if (e) e.preventDefault(); box.classList.remove('visible'); img.src = ''; }
				box.addEventListener('click', close);
				document.addEventListener('keydown', function(e) { if (e.key === 'Escape') close(); });
			})();
		</script>
